<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>글 읽기 · My Blog</title>
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 모드" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <a class="back-link" href="index.html">← 목록으로</a>
    <article id="post" aria-live="polite">
      <header class="post-header">
        <h1 id="post-title">불러오는 중…</h1>
        <div id="post-meta" class="meta"></div>
      </header>
      <div id="post-content" class="prose"></div>
    </article>
  </main>

  <footer class="site-footer">
    <div class="container">© My Blog</div>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/blog.js"></script>
</body>
</html>
