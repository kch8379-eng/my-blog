<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My Blog</title>
  <meta name="description" content="마크다운으로 쓰는 블로그">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}</script>
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="site-title" href="index.html">My Blog</a>
      <button id="theme-toggle" class="icon-button" type="button" aria-label="다크 모드" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 3a9 9 0 0 1 0 18z" fill="currentColor"/></svg>
      </button>
    </div>
  </header>

  <main class="container">
    <h1 class="visually-hidden">글 목록</h1>

    <section class="app-cards" aria-labelledby="apps-heading">
      <h2 id="apps-heading" class="section-title">앱</h2>
      <article class="app-card">
        <a class="app-card-preview" href="apps/2048/index.html" tabindex="-1" aria-hidden="true">
          <iframe src="apps/2048/index.html?preview" title="2048 미리보기" loading="lazy" tabindex="-1"></iframe>
        </a>
        <div class="app-card-body">
          <h3><a href="apps/2048/index.html">2048</a></h3>
          <p>방향키나 스와이프로 숫자 타일을 밀어 합치는 퍼즐 게임. 점수와 최고 점수를 기록합니다.</p>
          <a class="app-card-play" href="apps/2048/index.html">플레이하기</a>
        </div>
      </article>
      <article class="app-card">
        <a class="app-card-preview" href="apps/pixel-art/index.html" tabindex="-1" aria-hidden="true">
          <iframe src="apps/pixel-art/index.html?preview" title="픽셀 아트 에디터 미리보기" loading="lazy" tabindex="-1"></iframe>
        </a>
        <div class="app-card-body">
          <h3><a href="apps/pixel-art/index.html">픽셀 아트 에디터</a></h3>
          <p>16×16 격자에 도트를 찍어 그림을 그리고 PNG로 저장하는 에디터. 색상 팔레트와 되돌리기를 지원합니다.</p>
          <a class="app-card-play" href="apps/pixel-art/index.html">그리러 가기</a>
        </div>
      </article>
    </section>

    <h2 class="section-title">글</h2>
    <ul id="post-list" class="post-list" aria-live="polite">
      <li class="status">불러오는 중…</li>
    </ul>
  </main>

  <footer class="site-footer">
    <div class="container">© My Blog</div>
  </footer>

  <script type="module" src="js/theme.js"></script>
  <script type="module" src="js/blog.js"></script>
</body>
</html>
