<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2048</title>
  <meta name="description" content="방향키나 스와이프로 숫자 타일을 밀어 합치는 2048 퍼즐 게임">
  <script>try{var t=localStorage.getItem('theme');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch(e){}if(/[?&]preview(&|=|$)/.test(location.search))document.documentElement.classList.add('preview')</script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">2048</h1>
      <a class="back-link" href="../../index.html">← 블로그</a>
    </header>

    <section class="scoreboard" aria-label="점수판">
      <div class="score-box">
        <span class="score-label">점수</span>
        <span id="score" class="score-value" aria-live="polite">0</span>
        <span id="score-gain" class="score-gain" aria-hidden="true"></span>
      </div>
      <div class="score-box">
        <span class="score-label">최고</span>
        <span id="best" class="score-value">0</span>
      </div>
      <div class="actions">
        <button id="new-game-button" class="button button-primary" type="button">새 게임</button>
        <button id="undo-button" class="button" type="button" disabled>되돌리기</button>
      </div>
    </section>

    <p class="hint">방향키 또는 스와이프로 타일을 밀어 같은 숫자를 합치세요.</p>

    <div id="board" class="board">
      <div id="cell-layer" class="layer" aria-hidden="true"></div>
      <div id="tile-layer" class="layer" role="img" aria-label="2048 보드"></div>
      <div id="overlay" class="overlay" role="dialog" aria-labelledby="overlay-title" hidden>
        <p id="overlay-title" class="overlay-title"></p>
        <div class="overlay-actions">
          <button id="continue-button" class="button" type="button">계속하기</button>
          <button id="overlay-new-button" class="button button-primary" type="button">새 게임</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="main.js"></script>
</body>
</html>
